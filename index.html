<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0B1220;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(8, 120, 232, 0.2);
            border-top-color: #0878E8;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .text { margin-top: 20px; font-size: 14px; color: #93A2BE; }
        .error { color: #FF4D4D; margin-top: 20px; padding: 20px; text-align: center; max-width: 400px; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <div class="text">Loading App...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD_oCsqy_FXsBO0itOlxk69ZCYnduLYaes",
            authDomain: "ind-tournament-bb712.firebaseapp.com",
            databaseURL: "https://ind-tournament-bb712-default-rtdb.firebaseio.com",
            projectId: "ind-tournament-bb712",
            storageBucket: "ind-tournament-bb712.firebasestorage.app",
            messagingSenderId: "1046524735204",
            appId: "1:1046524735204:web:7e85c31aa60a7f368306f1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        (async function loadDynamicApp() {
            try {
                const snap = await get(ref(db, 'app_code/user_html'));
                if (!snap.exists()) {
                    document.body.innerHTML = '<div class="error">⚠️ App code not configured. Please contact support.</div>';
                    return;
                }

                const code = snap.val();

                // Replace current document with new code
                document.open();
                document.write(code);
                document.close();

            } catch (err) {
                document.body.innerHTML = '<div class="error">❌ Failed to load app: ' + err.message + '</div>';
                console.error(err);
            }
        })();
    </script>
</body>
</html>
